[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labor-charge-verifier"
version = "0.3.0"
description = "Open-source checks that labor charges on service contracts are backed by payroll, timekeeping and contract or wage-determination rates before an invoice is submitted."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Juliane Leão Andrade" }]
keywords = ["service-contract-act", "payroll-audit", "government-contracting", "wage-determination", "internal-controls"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = ["pandas>=2.0", "PyYAML>=6.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/julianeleaoandrade-dotcom/labor-charge-verifier"
"Browser version" = "https://julianeleaoandrade-dotcom.github.io/labor-charge-verifier/"
Issues = "https://github.com/julianeleaoandrade-dotcom/labor-charge-verifier/issues"

[project.scripts]
lcv = "labor_charge_verifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
